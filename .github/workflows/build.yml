# 拉取请求只构建和校验。推送到 master 时额外部署到 GitHub Pages。
# 部署要等仓库 Settings → Pages → Source 改成 GitHub Actions 之后才会成功。
name: Build & Deploy (Quartz)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quartz-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  QUARTZ_REF: v4.5.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出站点源码
        uses: actions/checkout@v4
        with:
          path: site

      - name: 检出固定版本的 Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: ${{ env.QUARTZ_REF }}
          path: qz

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qz/package-lock.json

      - name: 把内容和配置覆盖进 Quartz
        run: |
          set -euo pipefail
          test -f qz/package.json
          grep -q '"version": "4.5.2"' qz/package.json
          rm -rf qz/content
          cp -a site/content qz/content
          cp site/quartz/quartz.config.ts site/quartz/quartz.layout.ts qz/
          cp -a site/quartz/custom/. qz/quartz/

      - name: 安装依赖
        working-directory: qz
        run: npm ci

      - name: 构建
        working-directory: qz
        run: npx quartz build

      - name: 把 robots.txt 和 llms.txt 放到站点根
        run: |
          set -euo pipefail
          cp qz/quartz/static/robots.txt qz/public/robots.txt
          cp qz/quartz/static/llms.txt qz/public/llms.txt
          test ! -e qz/public/CNAME
          test ! -e qz/public/CNMAE

      - name: 校验旧 URL、canonical 和 JSON-LD
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r s || [ -n "$s" ]; do
            case "$s" in
              ""|\#*) continue ;;
            esac
            if [ ! -f "qz/public/$s/index.html" ]; then
              echo "MISSING $s"
              missing=1
            fi
          done < site/quartz/legacy-urls.txt
          test "$missing" -eq 0

          canon='href="https://ephmeral.github.io/network/cs144-lab0/"'
          grep -F "$canon" qz/public/network/cs144-lab0.html >/dev/null
          grep -F 'property="og:type" content="article"' qz/public/network/cs144-lab0.html >/dev/null
          grep -F 'property="article:published_time"' qz/public/network/cs144-lab0.html >/dev/null
          grep -F '"@type":"BlogPosting"' qz/public/network/cs144-lab0.html >/dev/null
          grep -F 'https://ephmeral.github.io/' qz/public/sitemap.xml >/dev/null
          if grep -q 'silasblog' qz/public/sitemap.xml qz/public/index.xml; then
            echo "sitemap 或 RSS 仍指向已失效的自定义域名"
            exit 1
          fi
          grep -F 'http-equiv="refresh"' "qz/public/nju-ics2021-pa2-1/index.html" >/dev/null
          grep -F 'http-equiv="refresh"' "qz/public/notes/chapter15-面向对象程序设计/index.html" >/dev/null
          # 旧 /archive/ 跳到归档页，不再跳回首页。
          grep -F 'http-equiv="refresh"' qz/public/archive/index.html >/dev/null
          grep -F 'url=../archive' qz/public/archive/index.html >/dev/null
          test -f qz/public/archive.html
          test -f qz/public/tags/index.html
          grep -F '总共有' qz/public/tags/index.html >/dev/null
          # 构建结果是压缩成一行的 HTML，按出现次数而不是行数来数。
          test "$(grep -o 'class="blog-item"' qz/public/index.html | wc -l)" -ge 24
          test "$(grep -o 'class="blog-item"' qz/public/archive.html | wc -l)" -ge 24

      - name: 配置 GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: qz/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
